<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserOS</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "config": "./config.js",
          "terminal": "./terminal.js",
          "windowmanager": "./windowmanager.js",
          "filesystem": "./filesystem.js"
        }
      }
    </script>
</head>
<body>
    <div id="screen">
        <div id="taskbar">
            <span id="menu-button">BOS</span>
            <div id="clock"></div>
        </div>
        <div id="desktop">
            <!-- Windows will be appended here -->
        </div>
        <div id="terminal-container" class="window draggable resizable">
             <div class="title-bar">
                <span class="title">Terminal</span>
                <div class="window-controls">
                  <button class="minimize">-</button>
                  <button class="maximize">[]</button>
                  <button class="close">X</button>
                </div>
            </div>
            <div class="content">
                <div id="terminal-output"></div>
                <div id="terminal-input-line">
                    <span id="prompt"></span>
                    <input type="text" id="terminal-input" autofocus>
                </div>
            </div>
        </div>
         <div id="menu" class="hidden">
             <ul>
                <li><button data-app="editor">Text Editor</button></li>
                <li><button data-app="file-explorer">File Explorer</button></li>
                <li><button data-app="about">About BrowserOS</button></li>
             </ul>
         </div>
    </div>
    <script type="module" src="main.js"></script>

</body>
</html>
